name: Deploy to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies and run Django tests
        run: |
          python -m pip install --target .python_packages/lib/site-packages -r requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE/.python_packages/lib/site-packages:$GITHUB_WORKSPACE/backend" \
            python backend/manage.py test config learning_api

      - name: Assemble deployment package
        run: |
          mkdir -p release
          cp -R backend dist .python_packages startup.sh requirements.txt release/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release
